<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">

    <title>GunesS - Painel Administrativo</title>
</head>

<body>

    <div class="sidebar">
        <div class="logo">
            <span class="logo-icon"><img src="assets/img/logo.png" alt=""></span>
            <span class="logo-text">Gunes<b>ADS</b></span>
        </div>

        <div class="nav-section-label">Administração</div>

        <nav>
            <button class="nav-item active" data-screen="anuncios-admin">
                <span class="nav-icon"><i class="bi bi-megaphone-fill"></i></span>
                <span class="nav-label">Anúncios do Admin</span>
            </button>

            <button class="nav-item" data-screen="usuarios">
                <span class="nav-icon"><i class="bi bi-people-fill"></i></span>
                <span class="nav-label">Usuários</span>
            </button>
        </nav>
    </div>

    <div class="sidebar-backdrop"></div>

    <main>

        <div class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menu-toggle">
                    <div class="line lin1"></div>
                    <div class="line lin2"></div>
                    <div class="line lin3"></div>
                </button>

                <h1 class="screen-title">Anúncios do Admin</h1>
            </div>

            <div class="topbar-right">

                <div class="user-info">
                    <div class="user-text">
                        <div class="user-hello">Olá, <b>nome</b></div>
                        <div class="user-plan"><i class="bi bi-shield-fill-check"></i> Admin</div>
                    </div>
                    <div class="avatar">AH</div>
                </div>

                <div class="user-menu">
                    
                </div>

            </div>
        </div>

    </main>

</body>

</html>
